<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixora - Film Platformu</title>
    <style>
        body { background-color: #141414; color: white; font-family: sans-serif; margin: 0; }
        header { background-color: #000; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; color: #E50914; }
        .container { padding: 20px; }
        .movie-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .movie-card { background: #222; width: 200px; border-radius: 8px; overflow: hidden; }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; }
        .movie-info { padding: 10px; }
    </style>
</head>
<body>
    <header>FLIXORA</header>
    <div class="container">
        <h2>Popüler Filmler</h2>
        <div class="movie-grid">
            <div class="movie-card">
                <img src="https://picsum.photos/300/450" alt="Film">
                <div class="movie-info"><h3>Örnek Film</h3></div>
            </div>
        </div>
    </div>
</body>
</html>
<iframe width="100%" height="450" src="https://www.youtube.com/embed/VIDEO_ID" frameborder="0" allowfullscreen></iframe>
